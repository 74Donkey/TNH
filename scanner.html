<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b321d">
<title>Naked Hop Scanner</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#fff8ef;color:#29231f}
header{background:#5b321d;color:white;padding:18px 16px}main{max-width:620px;margin:auto;padding:16px}
.card{background:white;border:1px solid #eadfd4;border-radius:16px;padding:16px;margin-bottom:14px}
button,a{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:#5b321d;color:white;text-decoration:none}
.secondary{background:#efe5dc;color:#5b321d}.muted{color:#766b63;font-size:13px}
#reader{width:100%;margin-top:12px}.status{padding:12px;border-radius:10px;background:#f4ece4;margin-top:12px;white-space:pre-wrap}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header><h2 style="margin:0">The Naked Hop Soaperie</h2><div style="opacity:.85">Camera Scanner</div></header>
<main>
<div class="card">
<p>Tap <b>Start Camera</b>, allow Safari camera access, then point your iPhone at a Naked Hop barcode or QR code.</p>
<div>
<button id="startBtn">Start Camera</button>
<button id="stopBtn" class="secondary">Stop</button>
</div>
<div id="status" class="status">Camera is off.</div>
<div id="reader"></div>
</div>
<div class="card">
<p><b>After a successful scan</b>, the product code is sent back to your cart.</p>
<a href="index.html#scan">Back to Checkout</a>
</div>
</main>

<script>
let scanner=null;
let lastCode='';
let lastTime=0;

function status(msg){document.getElementById('status').textContent=msg;}

function sendToCart(code){
  try{
    const raw=localStorage.getItem('nhs_scan_queue');
    let queue=[];
    if(raw){ try{ queue=JSON.parse(raw)||[]; }catch(e){} }
    if(!Array.isArray(queue)) queue=[];
    queue.push(String(code).trim());
    localStorage.setItem('nhs_scan_queue', JSON.stringify(queue));
    status('Scanned: '+code+'\nAdded to checkout cart. Tap Back to Checkout.');
    if(navigator.vibrate) navigator.vibrate(100);
  }catch(e){
    status('Scanned '+code+', but could not send it to the cart. You can enter the SKU manually.');
  }
}

async function start(){
  try{
    if(!window.Html5Qrcode){
      status('Scanner library did not load. Check your internet connection and reload this page.');
      return;
    }
    if(scanner){
      status('Camera is already running.');
      return;
    }
    status('Requesting camera permission…');
    const cams=await Html5Qrcode.getCameras();
    if(!cams || !cams.length){
      status('No camera found. On iPhone, check Settings → Apps → Safari → Camera and allow access.');
      return;
    }
    let chosen=cams.find(c=>/back|rear|environment/i.test(c.label)) || cams[cams.length-1];
    scanner=new Html5Qrcode('reader');
    await scanner.start(
      chosen.id,
      {fps:10, qrbox:{width:250,height:160}, aspectRatio:1.333},
      decoded=>{
        const now=Date.now();
        if(decoded===lastCode && now-lastTime<1800) return;
        lastCode=decoded; lastTime=now;
        sendToCart(decoded);
      },
      ()=>{}
    );
    status('Camera is on. Point it at a barcode or QR code.');
  }catch(e){
    try{ if(scanner) scanner.clear(); }catch(_){}
    scanner=null;
    status('Camera could not start.\n\nOn iPhone: Settings → Apps → Safari → Camera → Allow.\nThen reopen this page and tap Start Camera.');
  }
}

async function stop(){
  if(!scanner){status('Camera is already off.');return;}
  try{await scanner.stop(); scanner.clear();}catch(e){}
  scanner=null;
  status('Camera stopped.');
}

document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('stopBtn').addEventListener('click',stop);
</script>
</body>
</html>
